<!doctype html>
<!-- 1200×630 Open Graph card. Rendered to public/og.png by scripts/build-og.mjs.
     Colours are the dark-theme token values from design/tokens.json (surface-100, line, ink, ink-muted, pulse). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Sora'; src: url('../../public/fonts/Sora-Variable.woff2') format('woff2'); font-weight: 100 800; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../../public/fonts/JetBrainsMono-Variable.woff2') format('woff2'); font-weight: 100 800; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 96px 120px;
    background-color: #0B0D12;
    background-image: radial-gradient(#2A2F3A 1.2px, transparent 1.2px);
    background-size: 16px 16px;
    display: flex; flex-direction: column; justify-content: space-between;
    color: #EDEFF3; font-family: 'Sora', sans-serif;
  }
  img { width: 420px; height: auto; }
  h1 { margin: 0; font-size: 56px; line-height: 62px; font-weight: 500; letter-spacing: -0.03em; max-width: 900px; }
  h1 span { color: #9AA1AD; }
  p { margin: 0; display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; }
  i { width: 12px; height: 12px; border-radius: 999px; background: #3BE48E; display: inline-block; }
</style>
</head>
<body>
  <img src="../../public/brand/uyir-lockup-dark.svg" alt="">
  <h1><span>AI-native software</span> for real-world operations.</h1>
  <p><i></i>uyirailabs.com · Coimbatore</p>
</body>
</html>
